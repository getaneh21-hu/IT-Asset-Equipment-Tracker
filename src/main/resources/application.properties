
spring.application.name=it-asset-equipment-tracker

# Server
server.port=8081

# PostgreSQL - IT Asset Tracker database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/it_asset_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:asset_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET}